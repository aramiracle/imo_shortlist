<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMO Shortlist — Problem Set</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: { skipHtmlTags: ['script','noscript','style','textarea'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
    /* ═══════════════════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════════════════ */
    :root {
        --bg:        #07090f;
        --s0:        #0b0e19;
        --s1:        #0f1320;
        --s2:        #141929;
        --s3:        #1a2035;

        --b0:        #1b2038;
        --b1:        #252e50;
        --b2:        #31406e;

        --gold:      #cfa44c;
        --gold-b:    #e8c070;
        --gold-d:    #6a4e1e;
        --gold-g:    rgba(207,164,76,.09);
        --gold-h:    rgba(207,164,76,.16);

        --cream:     #e6dfd0;
        --sec:       #8e9ab8;
        --muted:     #4e5870;

        --alg:       #5fb8e8;  --alg-d: #1a3d5a;  --alg-g: rgba(95,184,232,.08);
        --cmb:       #5ccc78;  --cmb-d: #155a22;  --cmb-g: rgba(92,204,120,.08);
        --geo:       #cfa44c;  --geo-d: #5a3a0a;  --geo-g: rgba(207,164,76,.08);
        --nt:        #a87edc;  --nt-d:  #3a1a6e;  --nt-g:  rgba(168,126,220,.08);

        --easy:        #5fb8e8;
        --medium:      #5ccc78;
        --hard:        #cfa44c;
        --challenging: #e06060;

        --r:  10px;
        --rl: 16px;
        --rx: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
        font-family: 'EB Garamond', Georgia, serif;
        background: var(--bg);
        color: var(--cream);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Graph-paper grid */
    body::before {
        content: '';
        position: fixed; inset: 0; z-index: 0;
        background-image:
            linear-gradient(rgba(207,164,76,.022) 1px, transparent 1px),
            linear-gradient(90deg, rgba(207,164,76,.022) 1px, transparent 1px);
        background-size: 52px 52px;
        pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════
       PAGE GRID — sidebar left (1fr), main right (2fr)
    ═══════════════════════════════════════════════════ */
    .page {
        position: relative; z-index: 1;
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 24px 80px;
        display: grid;
        grid-template-columns: 1fr 2fr;
        grid-template-rows: auto 1fr auto;
        column-gap: 28px;
    }

    .aside { grid-column: 1; grid-row: 1 / 4; min-width: 0; }
    .main  { grid-column: 2; grid-row: 1 / 4; min-width: 0; }

    @media (max-width: 980px) {
        .page {
            grid-template-columns: 1fr;
            grid-template-rows: auto auto;
            padding: 20px 16px 60px;
            row-gap: 18px;
        }

        .main {
            grid-column: 1;
            grid-row: 2;
            order: 2;
            width: 100%;
        }

        .aside {
            grid-column: 1;
            grid-row: 1;
            order: 1;
            position: static;
            top: auto;
            width: 100%;
            max-height: none;
            height: auto;
            overflow: visible;
        }
    }

    /* ═══════════════════════════════════════════════════
       SIDEBAR
    ═══════════════════════════════════════════════════ */
    .aside {
        display: flex;
        flex-direction: column;
        gap: 14px;
        scrollbar-width: thin;
        scrollbar-color: var(--b1) transparent;
    }

    @media (min-width: 981px) {
        .aside {
            position: sticky;
            top: 32px;
            height: fit-content;
            max-height: calc(100vh - 64px);
            overflow-y: auto;
        }
    }

    .scard {
        background: var(--s1);
        border: 1px solid var(--b0);
        border-radius: var(--rl);
        padding: 18px;
    }

    .slabel {
        font-family: 'JetBrains Mono', monospace;
        font-size: .6rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
    }

    /* Stats */
    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .stat {
        background: var(--s2);
        border-radius: var(--r);
        padding: 12px;
        text-align: center;
    }

    .stat-n {
        font-family: 'Playfair Display', serif;
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--gold);
        line-height: 1;
        display: block;
    }

    .stat-l {
        font-family: 'JetBrains Mono', monospace;
        font-size: .55rem;
        color: var(--muted);
        letter-spacing: .08em;
        text-transform: uppercase;
        margin-top: 3px;
        display: block;
    }

    /* Navigator */
    .nav-cat { margin-top: 12px; }
    .nav-cat:first-child { margin-top: 0; }

    .nav-cat-lbl {
        font-family: 'JetBrains Mono', monospace;
        font-size: .58rem;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0 8px;
    }

    .nav-cat-lbl::before {
        content: '';
        width: 10px; height: 2px;
        border-radius: 1px;
    }

    .nav-cat-lbl.alg::before { background: var(--alg); }
    .nav-cat-lbl.cmb::before { background: var(--cmb); }
    .nav-cat-lbl.geo::before { background: var(--geo); }
    .nav-cat-lbl.nt::before  { background: var(--nt); }

    .nav-dots {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
    }

    .ndot {
        width: 26px; height: 26px;
        border-radius: 6px;
        border: 1px solid var(--b0);
        background: var(--s2);
        font-family: 'JetBrains Mono', monospace;
        font-size: .54rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all .18s;
        text-decoration: none;
        color: var(--muted);
    }

    .ndot:hover { border-color: var(--b2); color: var(--cream); transform: translateY(-1px); }
    .ndot.alg { border-color: var(--alg-d); color: var(--alg); }
    .ndot.cmb { border-color: var(--cmb-d); color: var(--cmb); }
    .ndot.geo { border-color: var(--geo-d); color: var(--geo); }
    .ndot.nt  { border-color: var(--nt-d);  color: var(--nt); }

    /* Difficulty legend */
    .legend { display: flex; flex-direction: column; gap: 7px; }

    .leg-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: .84rem;
        color: var(--sec);
    }

    .leg-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .leg-dot.easy        { background: var(--easy); }
    .leg-dot.medium      { background: var(--medium); }
    .leg-dot.hard        { background: var(--hard); }
    .leg-dot.challenging { background: var(--challenging); }

    .leg-rng {
        margin-left: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: .62rem;
        letter-spacing: .04em;
        color: var(--muted);
    }

    .leg-note {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--b0);
        font-size: .82rem;
        line-height: 1.45;
        color: var(--sec);
    }

    /* ═══════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════ */
    .header {
        position: relative;
        background: var(--s1);
        border: 1px solid var(--b0);
        border-radius: var(--rx);
        padding: 52px 52px 40px;
        text-align: center;
        overflow: hidden;
        margin-bottom: 18px;
    }

    .header::before {
        content: '';
        position: absolute;
        top: -80px; left: 50%;
        transform: translateX(-50%);
        width: 560px; height: 280px;
        background: radial-gradient(ellipse, rgba(207,164,76,.2) 0%, transparent 70%);
        pointer-events: none;
    }

    .header::after {
        content: '';
        position: absolute;
        top: 0; left: 80px; right: 80px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: .65rem;
        letter-spacing: .28em;
        text-transform: uppercase;
        color: var(--gold-d);
        margin-bottom: 18px;
        position: relative;
    }

    .h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(2rem, 5.5vw, 3.1rem);
        font-weight: 700;
        color: var(--cream);
        letter-spacing: -.02em;
        line-height: 1.08;
        margin-bottom: 12px;
        position: relative;
    }

    .h1 em { font-style: italic; color: var(--gold); }

    .subtitle {
        font-family: 'EB Garamond', serif;
        font-style: italic;
        font-size: 1.08rem;
        color: var(--muted);
        margin-bottom: 30px;
        position: relative;
    }

    /* Ornamental divider */
    .orn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 26px;
        position: relative;
    }

    .orn::before, .orn::after {
        content: '';
        width: 70px; height: 1px;
        background: linear-gradient(90deg, transparent, var(--b1));
    }

    .orn::after { background: linear-gradient(270deg, transparent, var(--b1)); }
    .orn-icon { color: var(--gold-d); font-size: .65rem; }

    .pills {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        position: relative;
    }

    .pill {
        font-family: 'JetBrains Mono', monospace;
        font-size: .66rem;
        color: var(--gold);
        border: 1px solid var(--gold-d);
        border-radius: 100px;
        padding: 5px 16px;
        background: var(--gold-g);
        letter-spacing: .05em;
    }

    /* ═══════════════════════════════════════════════════
       TABS
    ═══════════════════════════════════════════════════ */
    .tabs-wrap {
        background: var(--s1);
        border: 1px solid var(--b0);
        border-radius: var(--rx) var(--rx) 0 0;
        position: sticky;
        top: 0;
        z-index: 30;
        overflow: hidden;
    }

    .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-bottom: 1px solid var(--b0);
        overflow-x: auto;
        scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tbtn {
        padding: 16px 10px 14px;
        border: none;
        background: none;
        font-family: 'Playfair Display', serif;
        color: var(--muted);
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: color .22s, background .22s;
        white-space: nowrap;
    }

    .t-ico { font-size: 1.25rem; opacity: .4; transition: opacity .22s; line-height: 1; }
    .t-nm  { font-size: .9rem; }
    .t-cnt {
        font-family: 'JetBrains Mono', monospace;
        font-size: .56rem;
        opacity: .35;
        letter-spacing: .06em;
        transition: opacity .22s;
    }

    .tbtn::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 2px;
        transform: scaleX(0);
        transition: transform .28s cubic-bezier(.4,0,.2,1);
    }

    .tbtn[data-tab="alg"]::after { background: var(--alg); }
    .tbtn[data-tab="cmb"]::after { background: var(--cmb); }
    .tbtn[data-tab="geo"]::after { background: var(--geo); }
    .tbtn[data-tab="nt"]::after  { background: var(--nt); }

    .tbtn:hover { color: var(--cream); background: rgba(255,255,255,.025); }
    .tbtn:hover .t-ico { opacity: .7; }

    .tbtn.active[data-tab="alg"] { color: var(--alg); background: var(--alg-g); }
    .tbtn.active[data-tab="cmb"] { color: var(--cmb); background: var(--cmb-g); }
    .tbtn.active[data-tab="geo"] { color: var(--geo); background: var(--geo-g); }
    .tbtn.active[data-tab="nt"]  { color: var(--nt);  background: var(--nt-g); }
    .tbtn.active .t-ico { opacity: 1; }
    .tbtn.active .t-cnt { opacity: .65; }
    .tbtn.active::after { transform: scaleX(1); }

    /* ═══════════════════════════════════════════════════
       CONTENT PANEL
    ═══════════════════════════════════════════════════ */
    .panel {
        background: var(--s1);
        border: 1px solid var(--b0);
        border-top: none;
        border-radius: 0 0 var(--rx) var(--rx);
        overflow: hidden;
    }

    .subject {
        display: none;
        padding: 30px;
        animation: rise .3s ease both;
    }

    .subject.active { display: block; }

    @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Subject header */
    .subhd {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        background: var(--s2);
        border: 1px solid var(--b0);
        border-radius: var(--r);
        margin-bottom: 20px;
    }

    .sub-ico {
        width: 52px; height: 52px;
        border-radius: var(--r);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.7rem;
        flex-shrink: 0;
        font-family: 'Playfair Display', serif;
        font-style: italic;
    }

    .sub-ico.alg { background: var(--alg-g); border: 1px solid var(--alg-d); color: var(--alg); }
    .sub-ico.cmb { background: var(--cmb-g); border: 1px solid var(--cmb-d); color: var(--cmb); }
    .sub-ico.geo { background: var(--geo-g); border: 1px solid var(--geo-d); color: var(--geo); }
    .sub-ico.nt  { background: var(--nt-g);  border: 1px solid var(--nt-d);  color: var(--nt); }

    .sub-info h2 {
        font-family: 'Playfair Display', serif;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--cream);
        margin-bottom: 5px;
    }

    .sub-info p {
        font-size: .87rem;
        color: var(--sec);
        font-style: italic;
    }

    .sub-badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: .7rem;
        font-style: normal;
        padding: 3px 11px;
        border-radius: 100px;
        margin-right: 8px;
    }

    .sub-badge.alg { color: var(--alg); background: var(--alg-g); border: 1px solid var(--alg-d); }
    .sub-badge.cmb { color: var(--cmb); background: var(--cmb-g); border: 1px solid var(--cmb-d); }
    .sub-badge.geo { color: var(--geo); background: var(--geo-g); border: 1px solid var(--geo-d); }
    .sub-badge.nt  { color: var(--nt);  background: var(--nt-g);  border: 1px solid var(--nt-d); }

    /* Filter bar */
    .fbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .fbar-lbl {
        font-family: 'JetBrains Mono', monospace;
        font-size: .6rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .fbtn {
        font-family: 'JetBrains Mono', monospace;
        font-size: .6rem;
        letter-spacing: .06em;
        padding: 4px 12px;
        border-radius: 100px;
        border: 1px solid var(--b0);
        background: none;
        color: var(--muted);
        cursor: pointer;
        transition: all .18s;
    }

    .fbtn:hover { color: var(--cream); border-color: var(--b1); }

    .fbtn.f-all         { color: var(--cream);       border-color: var(--b1); }
    .fbtn.f-easy        { color: var(--easy);        border-color: var(--alg-d); background: var(--alg-g); }
    .fbtn.f-medium      { color: var(--medium);      border-color: var(--cmb-d); background: var(--cmb-g); }
    .fbtn.f-hard        { color: var(--hard);        border-color: var(--geo-d); background: var(--geo-g); }
    .fbtn.f-challenging { color: var(--challenging); border-color: #5a2020; background: rgba(224,96,96,.06); }

    /* ═══════════════════════════════════════════════════
       PROBLEM CARDS
    ═══════════════════════════════════════════════════ */
    .plist { display: flex; flex-direction: column; gap: 14px; }

    .pcard {
        position: relative;
        background: var(--s2);
        border: 1px solid var(--b0);
        border-radius: var(--rl);
        overflow: hidden;
        transition: border-color .22s, box-shadow .22s, transform .18s;
    }

    .pcard::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        border-radius: 0;
    }

    .pcard.alg::before { background: var(--alg); }
    .pcard.cmb::before { background: var(--cmb); }
    .pcard.geo::before { background: var(--geo); }
    .pcard.nt::before  { background: var(--nt); }

    .pcard:hover { transform: translateY(-2px); }
    .pcard.alg:hover { border-color: var(--alg-d); box-shadow: 0 8px 28px rgba(0,0,0,.35), 0 0 0 1px var(--alg-g); }
    .pcard.cmb:hover { border-color: var(--cmb-d); box-shadow: 0 8px 28px rgba(0,0,0,.35), 0 0 0 1px var(--cmb-g); }
    .pcard.geo:hover { border-color: var(--geo-d); box-shadow: 0 8px 28px rgba(0,0,0,.35), 0 0 0 1px var(--geo-g); }
    .pcard.nt:hover  { border-color: var(--nt-d);  box-shadow: 0 8px 28px rgba(0,0,0,.35), 0 0 0 1px var(--nt-g); }

    .pcard.hidden { display: none; }

    /* Card header */
    .phd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px 13px 26px;
        border-bottom: 1px solid var(--b0);
        gap: 12px;
        flex-wrap: wrap;
    }

    .pid {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .pnum {
        font-family: 'Playfair Display', serif;
        font-size: 1.08rem;
        font-weight: 700;
    }

    .pcard.alg .pnum { color: var(--alg); }
    .pcard.cmb .pnum { color: var(--cmb); }
    .pcard.geo .pnum { color: var(--geo); }
    .pcard.nt  .pnum { color: var(--nt); }

    .psep {
        width: 1px; height: 13px;
        background: var(--b1);
    }

    .stars {
        display: flex;
        gap: 3px;
        align-items: center;
    }

    .star {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--b1);
    }

    .star.e { background: var(--easy); }
    .star.m { background: var(--medium); }
    .star.h { background: var(--hard); }
    .star.c { background: var(--challenging); }

    /* Diff badge */
    .dbadge {
        font-family: 'JetBrains Mono', monospace;
        font-size: .6rem;
        letter-spacing: .07em;
        padding: 3px 10px;
        border-radius: 100px;
        border: 1px solid;
        flex-shrink: 0;
    }

    .dbadge.easy        { color: var(--easy);        border-color: var(--alg-d); background: var(--alg-g); }
    .dbadge.medium      { color: var(--medium);      border-color: var(--cmb-d); background: var(--cmb-g); }
    .dbadge.hard        { color: var(--hard);        border-color: var(--geo-d); background: var(--geo-g); }
    .dbadge.challenging { color: var(--challenging); border-color: #5a2020;      background: rgba(224,96,96,.06); }
    .dbadge.false       { color: #e06060; border-color: #5a2020; background: rgba(224,96,96,.10); }
    .dbadge.open        { color: var(--gold-b); border-color: var(--gold-d); background: var(--gold-g); }

    .phd-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .rscore {
        font-family: 'JetBrains Mono', monospace;
        font-size: .92rem;
        font-weight: 500;
        letter-spacing: .02em;
        line-height: 1;
        display: flex;
        align-items: baseline;
        gap: 3px;
    }

    .rscore.easy        { color: var(--easy); }
    .rscore.medium      { color: var(--medium); }
    .rscore.hard        { color: var(--hard); }
    .rscore.challenging { color: var(--challenging); }

    .rscore small {
        font-size: .58rem;
        color: var(--muted);
        font-weight: 400;
        letter-spacing: .06em;
    }

    .rmeter {
        height: 2px;
        background: var(--b0);
    }

    .rmeter > span {
        display: block;
        height: 100%;
        border-radius: 0 1px 1px 0;
    }

    .rmeter.easy > span        { background: var(--easy); }
    .rmeter.medium > span      { background: var(--medium); }
    .rmeter.hard > span        { background: var(--hard); }
    .rmeter.challenging > span { background: var(--challenging); }

    .why-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: .68rem;
        letter-spacing: .04em;
        color: var(--sec);
    }

    .why-meta b { color: var(--cream); font-weight: 500; }

    /* Card body */
    .pbody {
        padding: 22px 26px 24px;
    }

    .ptxt {
        font-family: 'EB Garamond', serif;
        font-size: 1.1rem;
        line-height: 1.82;
        color: var(--cream);
    }

    .ptxt em { color: var(--sec); font-size: 1.02rem; }

    .ptxt ol {
        margin: 14px 0 0 1.4em;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .ptxt li { line-height: 1.65; }

    /* MathJax overflow fix */
    mjx-container[jax="CHTML"][display="true"] {
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
    }


    /* ═══════════════════════════════════════════════════
       SOLUTION TOGGLE
    ═══════════════════════════════════════════════════ */
    .sol { border-top: 1px solid var(--b0); }

    .sol summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 22px 11px 26px;
        font-family: 'JetBrains Mono', monospace;
        font-size: .64rem;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--muted);
        transition: color .18s, background .18s;
        user-select: none;
    }

    .sol summary::-webkit-details-marker { display: none; }
    .sol summary::before { content: '▸'; transition: transform .2s; }
    .sol[open] summary::before { transform: rotate(90deg); }
    .sol summary:hover { color: var(--cream); background: rgba(255,255,255,.025); }
    .sol[open] summary { color: var(--gold); background: var(--s3); }

    .sol-body {
        padding: 18px 26px 22px;
        background: var(--s3);
        font-family: 'EB Garamond', serif;
        font-size: 1.08rem;
        line-height: 1.8;
        color: var(--cream);
    }

    .sol-empty { color: var(--muted); font-style: italic; font-size: 1rem; }
    .sol-empty code { font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: .76rem; color: var(--gold); }

    .sol-body.steps { padding: 0; }

    .sol-answer {
        padding: 16px 26px 14px;
        border-bottom: 1px solid var(--b0);
    }
    .sol-answer-lbl {
        display: block;
        margin-bottom: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: .62rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--gold-b);
    }
    .sol-answer p { margin: 0; }

    .hint { border-top: 1px solid var(--b0); }
    .hint:first-child { border-top: none; }

    .hint summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px 10px 26px;
        font-family: 'JetBrains Mono', monospace;
        font-size: .62rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--sec);
        user-select: none;
    }

    .hint summary::-webkit-details-marker { display: none; }
    .hint summary::before { content: '▸'; font-size: .7rem; transition: transform .2s; color: var(--muted); }
    .hint[open] summary::before { transform: rotate(90deg); }
    .hint summary:hover { color: var(--cream); background: rgba(255,255,255,.03); }
    .hint[open] > summary { color: var(--gold-b); }

    .hint-body {
        padding: 0 26px 14px;
        font-family: 'EB Garamond', serif;
        font-size: 1.05rem;
        line-height: 1.75;
        color: var(--cream);
    }

    @media (max-width: 480px) {
        .sol summary { padding: 10px 14px 10px 18px; }
        .sol-body { padding: 14px 18px 16px; }
        .hint summary { padding: 9px 14px 9px 18px; }
        .hint-body { padding: 0 18px 12px; }
        .sol-answer { padding: 12px 18px; }
    }

    /* ═══════════════════════════════════════════════════
       FOOTER
    ═══════════════════════════════════════════════════ */
    .footer {
        background: var(--s1);
        border: 1px solid var(--b0);
        border-radius: var(--rx);
        padding: 18px 32px;
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .footer span {
        font-family: 'JetBrains Mono', monospace;
        font-size: .68rem;
        color: var(--muted);
        letter-spacing: .04em;
    }

    .footer .orn-f { color: var(--gold-d); }

    /* ═══════════════════════════════════════════════════
       RESPONSIVE — tablet
    ═══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
        .header { padding: 38px 28px 32px; border-radius: var(--rl); }
        .header::after { left: 40px; right: 40px; }

        .tabs { grid-template-columns: repeat(4, minmax(72px, 1fr)); }

        .tbtn { padding: 13px 6px 11px; }
        .t-nm  { font-size: .82rem; }

        .subject { padding: 22px; }
        .subhd   { padding: 14px 18px; }
        .phd     { padding: 12px 18px 11px 22px; }
        .pbody   { padding: 18px 22px 20px; }
    }

    /* ═══════════════════════════════════════════════════
       RESPONSIVE — mobile
    ═══════════════════════════════════════════════════ */
    @media (max-width: 480px) {
        .page { padding: 10px 10px 48px; row-gap: 14px; }

        .aside { gap: 10px; }
        .scard { padding: 14px; }

        .header {
            padding: 28px 18px 26px;
            border-radius: var(--rl);
            margin-bottom: 12px;
        }

        .header::before { width: 280px; height: 160px; }
        .header::after  { left: 30px; right: 30px; }
        .h1 { font-size: 1.9rem; }

        .tabs-wrap { border-radius: var(--rl) var(--rl) 0 0; }

        .tabs { grid-template-columns: repeat(4, 1fr); }

        .tbtn { padding: 11px 4px 9px; gap: 2px; }
        .t-ico { font-size: 1rem; }
        .t-nm  { font-size: .7rem; }
        .t-cnt { display: none; }

        .panel { border-radius: 0 0 var(--rl) var(--rl); }

        .subject { padding: 14px; }

        .subhd {
            padding: 12px 14px;
            gap: 10px;
        }

        .sub-ico { width: 42px; height: 42px; font-size: 1.3rem; }
        .sub-info h2 { font-size: 1.1rem; }
        .sub-info p  { font-size: .8rem; }

        .plist { gap: 10px; }

        .phd  { padding: 11px 14px 10px 18px; }
        .pbody{ padding: 14px 18px 16px; }
        .ptxt { font-size: 1rem; line-height: 1.72; }

        .footer {
            border-radius: var(--rl);
            margin-top: 12px;
            padding: 14px 18px;
            flex-direction: column;
            text-align: center;
            gap: 4px;
        }

        .orn-f { display: none; }
    }

    /* ═══════════════════════════════════════════════════
       STAGGERED CARD ENTRANCE
    ═══════════════════════════════════════════════════ */
    .subject.active .pcard {
        animation: cardIn .35s ease both;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    </style>
</head>
<body>

<div class="page">

    <aside class="aside">

        <div class="scard">
            <div class="slabel">Overview</div>
            <div class="stat-grid" id="stat-grid">
                <!-- filled by app.js -->
            </div>
        </div>

        <div class="scard">
            <div class="slabel">Problem Navigator</div>
            <div id="nav-cats">
                <!-- filled by app.js -->
            </div>
        </div>

        <div class="scard">
            <div class="slabel">Difficulty Scale</div>
            <div class="legend" id="legend">
                <!-- filled by app.js -->
            </div>
        </div>

    </aside>

    <main class="main">

        <header class="header">
            <p class="eyebrow">Mathematical Olympiad · Shortlist</p>
            <h1 class="h1">IMO <em>Shortlist</em> Problems</h1>
            <p class="subtitle">Algebra · Combinatorics · Geometry · Number Theory</p>
            <div class="orn"><span class="orn-icon">◆</span></div>
            <div class="pills" id="header-pills">
                <!-- filled by app.js -->
            </div>
        </header>

        <div class="tabs-wrap">
            <div class="tabs" role="tablist" id="tabs">
                <!-- filled by app.js -->
            </div>
        </div>

        <div class="panel" id="panel">
            <!-- filled by app.js -->
        </div>

        <footer class="footer">
            <span>IMO · Shortlist Problem Set</span>
            <span class="orn-f">◆</span>
            <span>© International Mathematical Olympiad</span>
        </footer>

    </main>
</div>

<script src="problems.js"></script>
<script src="app.js"></script>


</body>
</html>
